<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background subtle radial glow -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1c2518"/>
      <stop offset="60%" stop-color="#0f160c"/>
      <stop offset="100%" stop-color="#070a05"/>
    </radialGradient>

    <!-- Outer racing rim neon border -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffcc26"/>
      <stop offset="50%" stop-color="#3dff8e"/>
      <stop offset="100%" stop-color="#ff4747"/>
    </linearGradient>

    <!-- Car Body gradient (Vibrant Race Red) -->
    <linearGradient id="carBodyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d62415"/>
      <stop offset="30%" stop-color="#ff4233"/>
      <stop offset="70%" stop-color="#ff5940"/>
      <stop offset="100%" stop-color="#b81b0e"/>
    </linearGradient>

    <!-- Cockpit glass gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="70%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Gold accent gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff385"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Speed trail gradient -->
    <linearGradient id="trailGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3dff8e" stop-opacity="0"/>
      <stop offset="60%" stop-color="#3dff8e" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3dff8e" stop-opacity="0.85"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Rounded Icon Backdrop -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Rim Stroke -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#rimGrad)" stroke-width="7" opacity="0.85"/>

  <!-- Chequered Flag Pattern Curve / Speed Ribbon behind car -->
  <g opacity="0.18">
    <path d="M 60 410 C 140 370 200 440 290 390 C 370 350 420 380 470 330" fill="none" stroke="#f4efe3" stroke-width="28" stroke-dasharray="14 14"/>
    <path d="M 40 436 C 120 396 180 466 270 416 C 350 376 400 406 450 356" fill="none" stroke="#f4efe3" stroke-width="24" stroke-dasharray="12 12"/>
  </g>

  <!-- Dynamic Glowing Speed Particles / Trails -->
  <path d="M 200 370 L 175 445" stroke="url(#trailGrad)" stroke-width="7" stroke-linecap="round"/>
  <path d="M 235 385 L 225 465" stroke="url(#trailGrad)" stroke-width="9" stroke-linecap="round"/>
  <path d="M 285 385 L 295 465" stroke="url(#trailGrad)" stroke-width="9" stroke-linecap="round"/>
  <path d="M 320 370 L 345 445" stroke="url(#trailGrad)" stroke-width="7" stroke-linecap="round"/>

  <!-- Centered Racing Car (Group tilted slightly for speed action: -12 deg) -->
  <g transform="translate(256,242) rotate(-12)" filter="url(#dropShadow)">
    
    <!-- Cast Shadow under Car -->
    <ellipse cx="6" cy="18" rx="88" ry="122" fill="#000000" opacity="0.55" filter="url(#glow)"/>

    <!-- 4 Racing Tires (Rubber Black with Rim details) -->
    <!-- Front Left Tire -->
    <g transform="translate(-76, -82)">
      <rect x="-14" y="-24" width="28" height="48" rx="8" fill="#141414" stroke="#2a2a2a" stroke-width="2"/>
      <rect x="-7" y="-12" width="14" height="24" rx="4" fill="#3a3a3a"/>
    </g>
    <!-- Front Right Tire -->
    <g transform="translate(76, -82)">
      <rect x="-14" y="-24" width="28" height="48" rx="8" fill="#141414" stroke="#2a2a2a" stroke-width="2"/>
      <rect x="-7" y="-12" width="14" height="24" rx="4" fill="#3a3a3a"/>
    </g>
    <!-- Rear Left Tire (Wider) -->
    <g transform="translate(-82, 68)">
      <rect x="-17" y="-28" width="34" height="56" rx="9" fill="#141414" stroke="#2a2a2a" stroke-width="2"/>
      <rect x="-8" y="-14" width="16" height="28" rx="4" fill="#3a3a3a"/>
    </g>
    <!-- Rear Right Tire (Wider) -->
    <g transform="translate(82, 68)">
      <rect x="-17" y="-28" width="34" height="56" rx="9" fill="#141414" stroke="#2a2a2a" stroke-width="2"/>
      <rect x="-8" y="-14" width="16" height="28" rx="4" fill="#3a3a3a"/>
    </g>

    <!-- Front Wing / Splitter -->
    <path d="M -80 -105 L 80 -105 L 68 -88 L -68 -88 Z" fill="#1e2229" stroke="#333a44" stroke-width="2"/>
    <rect x="-16" y="-110" width="32" height="12" rx="3" fill="#ffcc26"/>

    <!-- Aerodynamic Chassis Main Body -->
    <!-- Curved F1 / Supercar shape -->
    <path d="M 0 -115 
             C 32 -115 48 -80 48 -50 
             C 48 -20 66 10 68 55 
             C 70 95 62 110 52 112 
             C 38 114 -38 114 -52 112 
             C -62 110 -70 95 -68 55 
             C -66 10 -48 -20 -48 -50 
             C -48 -80 -32 -115 0 -115 Z" 
          fill="url(#carBodyGrad)" stroke="#ff7666" stroke-width="3"/>

    <!-- Dual Racing Stripes (Signature Yellow/White) -->
    <path d="M -9 -114 L -9 113 L -2 113 L -2 -114 Z" fill="#ffffff" opacity="0.9"/>
    <path d="M 2 -114 L 2 113 L 9 113 L 9 -114 Z" fill="url(#goldGrad)"/>

    <!-- Front Nose Cone Highlight -->
    <polygon points="0,-112 -18,-70 18,-70" fill="#ffffff" opacity="0.25"/>

    <!-- Dual Headlights (Cyan/White Beam) -->
    <ellipse cx="-34" cy="-96" rx="8" ry="4" transform="rotate(-15, -34, -96)" fill="#ffffff" filter="url(#glow)"/>
    <ellipse cx="34" cy="-96" rx="8" ry="4" transform="rotate(15, 34, -96)" fill="#ffffff" filter="url(#glow)"/>

    <!-- Cockpit & Windshield -->
    <path d="M 0 -58 
             C 24 -58 28 -35 28 15 
             C 28 35 20 45 0 45 
             C -20 45 -28 35 -28 15 
             C -28 -35 -24 -58 0 -58 Z" 
          fill="#0c1017" stroke="#1f2733" stroke-width="2.5"/>

    <path d="M 0 -50 
             C 18 -50 20 -34 20 -10 
             C 8 -8 -8 -8 -20 -10 
             C -20 -34 -18 -50 0 -50 Z" 
          fill="url(#glassGrad)"/>

    <!-- Windshield Reflection Glare -->
    <path d="M -10 -46 L 6 -46 L -4 -16 L -14 -16 Z" fill="#ffffff" opacity="0.45"/>

    <!-- Driver Helmet (Yellow/Gold with dark visor) -->
    <circle cx="0" cy="8" r="14" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1.5"/>
    <path d="M -10 4 Q 0 1 10 4 Q 8 11 0 11 Q -8 11 -10 4 Z" fill="#0f172a"/>

    <!-- Engine Air Intake (above helmet) -->
    <path d="M -9 -28 L 9 -28 L 7 -14 L -7 -14 Z" fill="#111827" rx="2"/>

    <!-- Rear Wing / Spoiler (Aggressive Downforce) -->
    <g transform="translate(0, 102)">
      <!-- Spoiler Mounts -->
      <rect x="-30" y="-16" width="6" height="18" fill="#18181b"/>
      <rect x="24" y="-16" width="6" height="18" fill="#18181b"/>
      <!-- Main Wing Blade -->
      <rect x="-86" y="-6" width="172" height="18" rx="5" fill="#1c1917" stroke="#dc2626" stroke-width="2.5"/>
      <!-- Endplates -->
      <rect x="-90" y="-12" width="8" height="28" rx="3" fill="#ff4233"/>
      <rect x="82" y="-12" width="8" height="28" rx="3" fill="#ff4233"/>
      <!-- Rear Exhaust Glow / Brake Light -->
      <rect x="-14" y="5" width="28" height="6" rx="3" fill="#3dff8e" filter="url(#glow)"/>
    </g>
  </g>

  <!-- Interactive Stylized "Touch Finger" Indicator at Bottom-Right -->
  <!-- Represents the core mechanic: Finger Racing -->
  <g transform="translate(378, 372)" filter="url(#softGlow)">
    <!-- Finger target pulse circles -->
    <circle cx="0" cy="0" r="46" fill="none" stroke="#3dff8e" stroke-width="3" opacity="0.35"/>
    <circle cx="0" cy="0" r="32" fill="none" stroke="#3dff8e" stroke-width="4" stroke-dasharray="8 6" opacity="0.7"/>
    <circle cx="0" cy="0" r="18" fill="rgba(61,255,142,0.25)" stroke="#3dff8e" stroke-width="3"/>
    <circle cx="0" cy="0" r="7" fill="#ffffff"/>
  </g>

  <!-- Sparkle / Speed Highlights -->
  <polygon points="110,95 116,112 133,118 116,124 110,141 104,124 87,118 104,112" fill="#ffcc26" opacity="0.8"/>
  <polygon points="415,130 419,142 431,146 419,150 415,162 411,150 399,146 411,142" fill="#3dff8e" opacity="0.85"/>
</svg>
